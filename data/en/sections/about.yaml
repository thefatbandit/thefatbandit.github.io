summary: >-
  I run AI data programs for frontier labs at [Mercor](https://mercor.com), where I joined as employee #5 in
  the India office. I've piloted and scaled pipelines for audio, health and PhD-level education datasets,
  and today I lead payments, data quality and expert management for one of the company's largest projects.
  Before Mercor I was a strategy consultant at Arthur D. Little in the Middle East and India. I studied at
  IIT Kharagpur (dual degree in Chemical Engineering and Finance, minor in Computer Science), where I led the
  AI team of the Autonomous Ground Vehicle group and took F1 cars around the Indy 500 track autonomously.

