baseURL: https://thefatbandit.github.io/

title: "Arnesh Issar"

# Theme is pulled in as a Hugo module (see go.mod).
module:
  imports:
    - path: github.com/hugo-toha/toha/v4
  mounts:
    - source: static/files
      target: static/files
    - source: ./node_modules/flag-icons/flags
      target: static/flags
    - source: ./node_modules/@fontsource/mulish/files
      target: static/files
    - source: ./node_modules/katex/dist/fonts
      target: static/fonts

languages:
  en:
    locale: en
    label: English
    title: "Arnesh Issar"
    weight: 1
defaultContentLanguage: en

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

outputs:
  home: [HTML, RSS, JSON]   # JSON powers the client-side search

enableEmoji: true

params:
  background: /images/site/background.jpg
  logo:
    main: /images/site/main-logo.png
    inverted: /images/site/inverted-logo.png
    favicon: /images/site/favicon.png

  gitRepo: https://github.com/thefatbandit/thefatbandit.github.io
  gitBranch: main

  topNavbar:
    maxVisibleSections: 5

  features:
    theme:
      enable: true
      services: { light: true, dark: true, default: system }
    portfolio:
      enable: true
    blog:
      enable: true
      showAuthor: true
      shareButtons: { twitter: true, linkedin: true, whatsapp: true, email: true }
    notes:
      enable: false
    comment:
      enable: false
    analytics:
      enable: false        # add a Google Analytics / GoatCounter id here later
    support:
      enable: false
    toc:
      enable: true
    tags:
      enable: true
      on_card: true
    flags:
      enable: false        # single language, no flag selector
    embedpdf:
      enable: true
    flowchart:
      enable: true
      services:
        mermaid:
          theme: forest
    math:
      enable: true
      services:
        katex:
          delimiters:
            - left: $$
              right: $$
              display: true
            - left: \\[
              right: \\]
              display: true
            - left: \\(
              right: \\)
              display: false
    syntaxHighlight:
      enable: true
      services:
        hljs:
          noHighlightRe: /^no-highlight$/i
    videoPlayer:
      enable: true
      services:
        plyr: {}
    copyCodeButton:
      enable: true
    readingTime:
      enable: true
    pagination:
      maxPostsPerPage: 12

  footer:
    enable: true
    # theme footer + the home-page easter egg (layouts/partials/custom-footer.html)
    template: custom-footer.html
    navigation:
      enable: true
      customMenus: true
    contactMe:
      enable: true
    credentials:
      enable: true
    newsletter:
      enable: false
    disclaimer:
      enable: false
